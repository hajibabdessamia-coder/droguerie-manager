services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: l7ssab_manager
    ports:
      - "5432:5432"
    volumes:
      - l7ssab_db_data:/var/lib/postgresql/data

volumes:
  l7ssab_db_data:
