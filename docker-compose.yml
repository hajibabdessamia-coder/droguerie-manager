services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pharma_manager
    ports:
      - "5432:5432"
    volumes:
      - pharma_db_data:/var/lib/postgresql/data

volumes:
  pharma_db_data:
